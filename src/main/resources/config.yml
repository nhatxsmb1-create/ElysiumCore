# ElysiumCore Config
server-name: "Elysium"
season: 1
age: "BEGINNING"

database:
  type: sqlite   # sqlite or mysql
  mysql:
    host: localhost
    port: 3306
    database: elysium
    username: root
    password: ""
    pool-size: 10

defaults:
  starting-balance: 1000.0
  starting-mana: 100
  starting-level: 1
  max-mana: 100
  max-level: 100

# Tu dong save moi bao nhieu tick? (6000 = 5 phut)
auto-save:
  enabled: true
  interval: 6000

# Hien thi title khi level up?
level-up:
  title: true
  sound: true
  broadcast: false  # Thong bao cho ca server?

messages:
  prefix: "&b[Elysium] &r"
  no-permission: "&cBan khong co quyen!"
  player-not-found: "&cKhong tim thay nguoi choi!"
  reload-success: "&aReload config thanh cong!"
